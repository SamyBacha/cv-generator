<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur de Texte par Synthèse Vocale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        #drop-zone {
            border: 3px dashed #4285F4;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background-color: #fff;
            color: #555;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #drop-zone.hover {
            background-color: #e8f0fe;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            resize: vertical;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        select {
            flex: 1;
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            min-width: 100px;
        }
        button:hover {
            background-color: #3367d6;
        }
    </style>
</head>
<body>

<div id="drop-zone">
    Glissez-déposez un fichier texte (.txt) ici<br>ou cliquez pour en choisir un
</div>
<!-- Input caché déclenché par le clic sur la drop-zone -->
<input type="file" id="file-input" accept=".txt" style="display: none;">

<textarea id="text-content" placeholder="Le contenu de votre fichier apparaîtra ici... vous pouvez aussi écrire directement."></textarea>

<div class="controls">
    <select id="voice-select">
        <option value="">Chargement des voix...</option>
    </select>
    <button id="play-pause-btn">Lecture</button>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const textContent = document.getElementById('text-content');
    const voiceSelect = document.getElementById('voice-select');
    const playPauseBtn = document.getElementById('play-pause-btn');

    const synth = window.speechSynthesis;
    let voices = [];
    let utterance = new SpeechSynthesisUtterance();

    // 1. GESTION DES VOIX
    function loadVoices() {
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';

        let defaultSelected = false;

        voices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.value = index;

            // Sélectionner le français par défaut si disponible
            if (voice.lang.includes('fr-FR') && !defaultSelected) {
                option.selected = true;
                defaultSelected = true;
            }

            voiceSelect.appendChild(option);
        });
    }

    // Chrome charge les voix de manière asynchrone
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 2. LECTURE DU FICHIER (Glisser-Déposer & Clic)
    function readFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            textContent.value = e.target.result;
            synth.cancel(); // Arrête la lecture en cours si on charge un nouveau fichier
            playPauseBtn.textContent = 'Lecture';
        };
        reader.readAsText(file);
    }

    // Clic
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => readFile(e.target.files[0]));

    // Glisser-déposer
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('hover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('hover');
        if (e.dataTransfer.files.length > 0) {
            readFile(e.dataTransfer.files[0]);
        }
    });

    // 3. LECTURE / PAUSE VOCALE
    playPauseBtn.addEventListener('click', () => {
        // Si la synthèse est déjà en cours de prononciation
        if (synth.speaking) {
            if (synth.paused) {
                synth.resume();
                playPauseBtn.textContent = 'Pause';
            } else {
                synth.pause();
                playPauseBtn.textContent = 'Lecture';
            }
        } else {
            // Nouvelle lecture
            if (textContent.value.trim() === '') {
                alert("Veuillez d'abord charger un texte !");
                return;
            }

            utterance = new SpeechSynthesisUtterance(textContent.value);

            // Assigner la voix sélectionnée
            const selectedVoice = voices[voiceSelect.value];
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            // Réinitialiser le bouton à la fin de la lecture
            utterance.onend = () => {
                playPauseBtn.textContent = 'Lecture';
            };

            synth.speak(utterance);
            playPauseBtn.textContent = 'Pause';
        }
    });
</script>
</body>
</html>
